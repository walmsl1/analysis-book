# Check that the book builds whenever a pull request is opened or updated.
# The built website is attached to the run as a downloadable "deploy" artifact.
# (Adapted from the PreTeXt CLI template; managed by hand.)
name: Check build
on:
    pull_request:
        branches: ["*"]
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        container: oscarlevin/pretext-full

        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            - name: install deps
              run: pip install -r requirements.txt --break-system-packages

            - name: set up node
              uses: actions/setup-node@v4
              with:
                node-version: '22'

            - name: show PreTeXt version
              run: pretext --version

            - name: build website
              shell: bash
              run: |
                set -o pipefail
                pretext build web 2>&1 | tee web.log

            - name: build PDF
              shell: bash
              run: |
                set -o pipefail
                pretext build print 2>&1 | tee print.log

            - name: summarize build problems
              if: always()
              shell: bash
              run: |
                for f in web.log print.log; do
                  [ -f "$f" ] || continue
                  msg=$(grep -iE 'error|critical|warning|fatal|traceback|!' "$f" | grep -v 'Node.js 20' | tail -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
                  [ -n "$msg" ] && echo "::warning title=$f::$msg"
                  echo "::notice title=$f tail::$(tail -25 "$f" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
                done

            - name: stage website
              run: pretext deploy --stage-only

            - name: copy PDF into the staged website
              run: cp output/print/real-analysis.pdf output/stage/

            - name: Bundle output/stage as artifact
              uses: actions/upload-artifact@v4
              with:
                  name: deploy
                  path: output/stage
