# Check that the book builds whenever a pull request is opened or updated.
# The built website is attached to the run as a downloadable "deploy" artifact.
# (Adapted from the PreTeXt CLI template; managed by hand.)
name: Check build
on:
    pull_request:
        branches: ["*"]
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        container: oscarlevin/pretext-full

        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            - name: install deps
              run: pip install -r requirements.txt --break-system-packages

            - name: set up node
              uses: actions/setup-node@v4
              with:
                node-version: '22'

            - name: show PreTeXt version
              run: pretext --version

            - name: build website and PDF
              run: |
                pretext build web
                pretext build print

            - name: stage website
              run: pretext deploy --stage-only

            - name: copy PDF into the staged website
              run: cp output/print/real-analysis.pdf output/stage/

            - name: Bundle output/stage as artifact
              uses: actions/upload-artifact@v4
              with:
                  name: deploy
                  path: output/stage
